<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>foquita 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      animation: fadeIn 1.5s ease-in-out;
      position: relative;
    }

    h1 {
      font-size: 2.2em;
      color: #ff4d6d;
    }

    p {
      font-size: 1.2em;
      color: #333;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: #ff4d6d;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff1a4d;
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* Corazones flotando */
    .heart {
      position: absolute;
      font-size: 20px;
      color: red;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-800px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💖 Para Ti, Mi Amor 💖</h1>
    <p>Eres lo mejor que me ha pasado, gracias por hacerme tan feliz 💕</p>
    <button onclick="mostrarMensaje()">Haz clic aquí</button>
    <p id="mensaje" style="margin-top:20px; font-weight:bold; display:none; color:#ff1a4d;"></p>
  </div>

  <script>
    function mostrarMensaje() {
      let frases = [
        "Te amo más que ayer 💖",
        "Eres mi persona favorita 💕",
        "Siempre quiero estar contigo 😍",
        "Eres mi mundo 🌎",
        "Mi vida es más bonita contigo ✨"
      ];
      let mensaje = document.getElementById("mensaje");
      let random = Math.floor(Math.random() * frases.length);
      mensaje.innerText = frases[random];
      mensaje.style.display = "block";

      // Crear corazones flotando
      for (let i = 0; i < 5; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = window.innerHeight + "px";
        heart.style.fontSize = (Math.random() * 20 + 20) + "px";
        document.body.appendChild(heart);

        setTimeout(() => { heart.remove(); }, 5000);
      }
    }
  </script>
</body>
</html>
